
name: Update GitHub Profile Cards

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Generate main statistics
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=PotatoHakers&show_icons=true&theme=tokyonight&hide_border=true&card_width=900&show=issues_authored&owner=PotatoHakers'
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      # Generate programming languages
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=PotatoHakers&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&card_width=900'
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      # Generate trophies
      - name: Generate GitHub Trophies
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: 'username=PotatoHakers&theme=onedark&column=6&margin-w=12&margin-h=12&no-frame=true&no-bg=true'
          path: profile/trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      # Refresh image cache only when content changes
      - name: Update image versions
        run: |
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          for name in ("stats", "top-langs", "trophy"):
              file = Path(f"profile/{name}.svg")
              digest = hashlib.sha256(file.read_bytes()).hexdigest()[:12]
              pattern = rf"(profile/{re.escape(name)}\.svg)(?:\?v=[^\"')\s]*)?"
              text = re.sub(pattern, rf"\1?v={digest}", text)

          readme.write_text(text, encoding="utf-8")
          PY

      # Save generated files
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg README.md

          git diff --cached --quiet && exit 0

          git commit -m "Update GitHub profile cards"
          git push
